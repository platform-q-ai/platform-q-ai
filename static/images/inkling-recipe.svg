<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d">
<title id="t">Four coding agents on one RTX 5090</title><desc id="d">Total throughput for four concurrent agent streams: 746 tok/s at about 10k tokens of context per stream (about 920 while all four decode), 563 at 90k (about 670), and 162 at 150k.</desc>
<style>
.bg{fill:#ffffff}.t{fill:#16181d}.m{fill:#5b6069}.track{fill:#efece8}.bar{fill:#ff5722}.ghost{fill:#ff5722;opacity:.28}.rule{stroke:#e4e1dc;stroke-width:2}
text{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
@media (prefers-color-scheme:dark){.bg{fill:#16191c}.t{fill:#eceae6}.m{fill:#a3a8b0}.track{fill:#23272c}.bar{fill:#ff6a3d}.ghost{fill:#ff6a3d;opacity:.3}.rule{stroke:#2a2e33}}
</style>
<rect class="bg" width="1200" height="760"/>
<rect class="bar" x="60" y="56" width="48" height="6"/>
<text class="t" x="60" y="116" font-size="42" font-weight="600">Four coding agents on one RTX 5090</text>
<text class="m" x="60" y="160" font-size="28">Inkling 2 Mini · total tok/s across four concurrent streams</text>
<text class="t mono" x="60" y="240" font-size="34" font-weight="500">~10k context each</text>
<text class="t mono" x="1140" y="240" font-size="34" text-anchor="end">746 tok/s</text>
<rect class="track" x="60" y="260" width="1080" height="48" rx="4"/>
<rect class="ghost" x="60" y="260" width="993.6" height="48" rx="4"/>
<rect class="bar" x="60" y="260" width="805.7" height="48" rx="4"/>
<text class="t mono" x="60" y="390" font-size="34" font-weight="500">~90k context each</text>
<text class="t mono" x="1140" y="390" font-size="34" text-anchor="end">563 tok/s</text>
<rect class="track" x="60" y="410" width="1080" height="48" rx="4"/>
<rect class="ghost" x="60" y="410" width="723.6" height="48" rx="4"/>
<rect class="bar" x="60" y="410" width="608.0" height="48" rx="4"/>
<text class="t mono" x="60" y="540" font-size="34" font-weight="500">~150k context each</text>
<text class="t mono" x="1140" y="540" font-size="34" text-anchor="end">162 tok/s</text>
<rect class="track" x="60" y="560" width="1080" height="48" rx="4"/>
<rect class="bar" x="60" y="560" width="175.0" height="48" rx="4"/>
<line class="rule" x1="60" x2="1140" y1="650" y2="650"/>
<text class="m" x="60" y="690" font-size="28">Lighter bar: about 920 and 670 tok/s while all four streams decode.</text>
<text class="m" x="60" y="730" font-size="28">At ~150k each, four contexts exceed the 380k-token KV pool, so they take turns.</text>
</svg>
